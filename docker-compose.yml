version: '3.8'

services:
  # Servicio de la Base de Datos (SQL Server)
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Passw0rd
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "YourStrong@Passw0rd", "-C", "-Q", "SELECT 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Servicio del Backend (.NET)
  backend:
    build:
      context: ./Portafolio.Backend/Portafolio.API
      dockerfile: Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=PortafolioDB;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;
      - Jwt__Key=ESTA_ES_UNA_CLAVE_SECRETA_SUPER_LARGA_Y_SEGURA_PARA_TU_PORTAFOLIO_2026
      - Jwt__Issuer=PortafolioAPI
      - Jwt__Audience=PortafolioReact
    ports:
      - "5205:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  # Servicio del Frontend (React)
  frontend:
    build:
      context: ./Portafolio.Frontend.React
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  sql_data:
